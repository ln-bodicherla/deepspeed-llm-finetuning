model:
  name: "meta-llama/Llama-2-7b-hf"
  revision: "main"
  trust_remote_code: false
  torch_dtype: "bfloat16"

training:
  num_epochs: 3
  learning_rate: 2.0e-5
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_seq_length: 2048
  gradient_checkpointing: true
  gradient_accumulation_steps: 4
  per_device_batch_size: 4
  max_grad_norm: 1.0
  seed: 42
  logging_steps: 10
  save_steps: 500
  eval_steps: 250
  save_total_limit: 3

data:
  dataset: "tatsu-lab/alpaca"
  max_samples: null
  val_split: 0.05
  preprocessing_num_workers: 4
  shuffle: true
  shuffle_seed: 42

output:
  dir: "./checkpoints"
  hf_dir: "./models/finetuned"
  logging_dir: "./logs"

wandb:
  enabled: true
  project: "deepspeed-finetuning"
  entity: null
  run_name: null

evaluation:
  metrics:
    - perplexity
    - rouge
  eval_samples: 500
  generation_max_length: 256
  generation_temperature: 0.7
